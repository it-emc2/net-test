# CI — tests on every PR and every push except main. Never deploys anything.
# (Deploy stays in fly-deploy.yml, which only runs on pushes to main.)
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
  # Tests must never reach a real service; nothing here has secrets.
  MONGODB_URI: ""
  BITRIX_WEBHOOK_BASE: "http://127.0.0.1:9/rest/0/blocked/"

jobs:
  tests:
    name: Golden + unit + integration + node:test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (reporting only — 12 pre-existing errors on main, see docs/rewrite/TESTING.md)
        run: npm run lint
        continue-on-error: true
      - name: Golden masters (pricing + DOCX) — must stay green
        run: npm run test:golden
      - name: Unit (15 pre-existing failures, tracked)
        run: npm run test:unit
        continue-on-error: true
      - name: Integration (1 pre-existing failure, tracked)
        run: npm run test:integration
        continue-on-error: true
      - name: node:test
        run: npm run test:node

  v2:
    name: v2 (TypeScript rewrite) — typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # PDF engine (ADR 008) — real DOCX→PDF / HTML→PDF conversions in the document tests
      gotenberg:
        image: gotenberg/gotenberg:8.40.0
        ports: ["3000:3000"]
    env:
      OC_TEST_GOTENBERG_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            v2/package-lock.json
            package-lock.json
      - name: Install legacy app deps (contract test spawns the legacy server)
        run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (server + packages)
        run: npx tsc -b
      - name: Typecheck (web)
        run: npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Tests (config, domain, pricing, server incl. legacy contract test, web)
        run: npx vitest run
      - name: Build web
        run: npm run build -w @oc/web

  parity:
    name: UI parity (Playwright, own in-memory DB, outbound blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:parity
      - name: Offline suite
        run: npm run test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            test-results-parity-*.log
          retention-days: 7

  parity-v2:
    name: UI parity against v2 (same Playwright suite, v2 serves today's UI — ADR 021)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: v2
      - name: Build v2
        run: npx tsc -b
        working-directory: v2
      - run: npx playwright install --with-deps chromium
      - name: Parity suite against v2
        run: npm run test:parity
        env:
          PARITY_TARGET: v2
      - name: Offline suite against v2 (service worker, offline drafts/pricing/sync — phase 6d)
        run: npm run test:e2e:offline
        env:
          PARITY_TARGET: v2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-v2
          path: |
            test-results/
            test-results-parity-*.log
          retention-days: 7

  docker-smoke:
    name: v2 Docker image + compose smoke test (app, Gotenberg, Caddy — phase 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2/deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (local MongoDB, integrations on a dead port)
        run: docker compose -f docker-compose.yml -f compose.smoke.yml up -d --build --wait --wait-timeout 180
      - name: Health, login page with security headers, UI files, PDF engine reachable
        run: |
          set -e
          curl -fsS http://localhost/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsSI http://localhost/login | tee /tmp/h.txt
          grep -qi '^content-security-policy:' /tmp/h.txt
          grep -qi '^x-frame-options: SAMEORIGIN' /tmp/h.txt
          curl -fsS http://localhost/login | grep -q '<form'
          curl -fsS http://localhost/script.js | grep -q 'Ja, neuen Link erstellen'
          curl -fsS http://localhost/v2/addons/ux.js | grep -q 'An Planung übergeben'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/offers/search-all?q=x)" = "401"
          docker compose -f docker-compose.yml -f compose.smoke.yml exec -T app node -e "fetch('http://gotenberg:3000/health').then(r=>r.json()).then(j=>{console.log(JSON.stringify(j)); process.exit(j.status==='up'?0:1)}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.smoke.yml logs --no-color --tail=200

