<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokumente unterschreiben – EmC2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif;
      background: #eceae5; color: #111; padding: 24px 12px; font-size: 15px;
      overflow-x: hidden;
    }
    .sheet {
      max-width: 880px; margin: 0 auto 20px; background: #fff;
      border: 1px solid #000; padding: 10px 100px 100px;
      overflow-x: auto;
    }
    .sheet__header { margin-bottom: 4px; }
    .sheet__header .title { font-size: 13px; font-family: 'Courier New', monospace; color: #333; }
    .progress { font-size: 13px; font-family: 'Courier New', monospace; color: #333; margin: 0 0 14px; }
    .docnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
    .docnav .progress { margin: 0; }
    .docnav button { font-size: 13px; padding: 6px 12px; border: 1px solid #aaa; background: #fff; cursor: pointer; }
    .docnav button:disabled { opacity: .4; cursor: not-allowed; }
    .hidden { display: none !important; }
    .feedback { padding: 12px 14px; font-size: 15px; border: 1px solid transparent; }
    .feedback.is-success { background: #e6f6e6; border-color: #2e7d32; color: #1b5e20; }
    .feedback.is-error { background: #fdecea; border-color: #b71c1c; color: #7f1d1d; white-space: pre-line; }
    #backToOc { display: block; margin: 0 0 14px; font-size: 13px; color: #333; text-decoration: none; }
    #backToOc:hover { text-decoration: underline; }
    /* Antrag an die Pflegekasse — rep only, after all documents are signed */
    #kassenantrag { margin-top: 18px; border: 1px solid #000; padding: 14px 16px; }
    #kassenantrag h2 { font-size: 16px; margin: 0 0 8px; }
    #kassenantrag label { display: block; font-size: 13px; color: #333; margin: 10px 0 4px; }
    #kassenantrag textarea { width: 100%; font: inherit; font-size: 14px; padding: 6px; border: 1px solid #aaa; }
    #kassenantrag .ka-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    #kassenantrag button { font-size: 15px; padding: 10px 16px; border: 1px solid #000; background: #fff; cursor: pointer; }
    #kassenantrag button.primary { background: #111; color: #fff; }
    #kassenantrag button:disabled { opacity: .4; cursor: not-allowed; }
    #kaStatus { margin-top: 10px; }
    @media (max-width: 640px) {
      body { padding: 10px 6px; }
      .sheet { padding: 10px 14px 22px; }
    }
  </style>
</head>
<body data-internal-user="false">
  <div id="loading" class="sheet"><p>Dokument wird geladen …</p></div>
  <div id="fatal" class="sheet feedback is-error hidden"></div>

  <div id="app" class="hidden">
    <main class="sheet">
      <header class="sheet__header">
        <a href="/" id="backToOc" class="hidden">&larr; Zurück zum Konfigurator</a>
        <span class="title">Online-Unterschrift</span>
      </header>
      <div class="docnav hidden" id="docNav">
        <button type="button" id="prevDoc">&larr; Zurück</button>
        <span class="progress" id="progress"></span>
        <button type="button" id="nextDoc">Weiter &rarr;</button>
      </div>

      <!-- The document (with its own checkboxes + signature + submit) is injected here. -->
      <div id="docContainer"></div>

      <div id="doneCard" class="feedback is-success hidden">
        <strong>Vielen Dank!</strong>
        Alle Dokumente wurden unterschrieben und an uns übermittelt.
        Sie erhalten in Kürze eine Kopie per E-Mail.
      </div>

      <section id="kassenantrag" class="hidden">
        <h2>Antrag an die Pflegekasse (§ 40 Abs. 4 SGB XI)</h2>
        <div id="kaTarget"></div>
        <label for="kaMeasures">Geplante Maßnahmen (eine pro Zeile)</label>
        <textarea id="kaMeasures" rows="6"></textarea>
        <label for="kaReason">Begründung</label>
        <textarea id="kaReason" rows="4"></textarea>
        <div class="ka-actions">
          <button type="button" id="kaPreview">Vorschau (PDF)</button>
          <button type="button" id="kaSend" class="primary">An Pflegekasse senden</button>
        </div>
        <div id="kaStatus" class="feedback hidden"></div>
      </section>
    </main>
  </div>

  <script src="/signpage/app.js"></script>
</body>
</html>
