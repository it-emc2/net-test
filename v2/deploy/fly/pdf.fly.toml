# PDF engine (Gotenberg, ADR 008) for the OC v2 Fly app. No public address: only reachable from
# the same Fly organisation as http://oc-emc2-test-pdf.internal:3000.
#   flyctl deploy --config v2/deploy/fly/pdf.fly.toml
app = 'oc-emc2-test-pdf'
primary_region = 'fra'

[build]
  # same pin as v2/deploy/docker-compose.yml
  image = 'gotenberg/gotenberg:8.40.0@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996'

[[vm]]
  memory = '1gb'
  cpus = 1
