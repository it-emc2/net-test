# OC v2 as a second Fly.io app beside today's app (owner decision 2026-11-24, CUTOVER.md §1a).
# Deploy from the repository root (the image needs the legacy assets next to v2/):
#   flyctl deploy . --config v2/deploy/fly/app.fly.toml --dockerfile v2/Dockerfile \
#     --ignorefile v2/Dockerfile.dockerignore --remote-only
# Secrets are set once with `flyctl secrets import` — never in this file.
app = 'ocv2-react'
primary_region = 'fra'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '8080'
  # the React app is the start of the test app (U-061); today's UI stays reachable at /?classic=1
  START_UI = 'react'
  # the React signing page at /sign/<token> (U-068), owner 2026-11-25: on for the test app to try
  SIGNING_UI = 'react'
  # company line of the signing page's contact block (U-071), owner 2026-11-25; the registered
  # company name, spelled as in today's offer templates
  COMPANY_NAME = 'EmC2 Attila Landgrafe'
  # GOTENBERG_URL is a secret, the same value as today's app: it carries the login of the shared
  # PDF engine `emc2-gotenberg` (deploy/gotenberg on main). No second PDF app.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  memory = '1gb'
  cpus = 1
